<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="980" height="490" rx="22" fill="url(#canvasBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ========================================================================= -->
  <!-- PHONE 1: HOME SCREEN (Minimalist Saved Trips + "+ New Trip" FAB)          -->
  <!-- ========================================================================= -->
  <g transform="translate(28, 20)" filter="url(#phoneShadow)">
    <!-- Phone Frame -->
    <rect width="288" height="446" rx="34" fill="#090D16" stroke="#263248" stroke-width="2.5"/>
    <!-- Status Bar -->
    <text x="26" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600">9:41</text>
    <rect x="114" y="11" width="60" height="14" rx="7" fill="#030712"/>
    <text x="236" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">5G 100%</text>

    <!-- TopAppBar: Hamburger + "PackTrack" + "3 trip(s)" -->
    <text x="22" y="54" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="16">☰</text>
    <text x="50" y="50" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">PackTrack</text>
    <text x="50" y="63" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5">3 trip(s)</text>

    <!-- SavedTripCard 1: Seattle -->
    <g transform="translate(14, 78)">
      <rect width="260" height="52" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="23" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Seattle</text>
      <!-- Relative Start Pill -->
      <rect x="62" y="11" width="48" height="16" rx="5" fill="#1E293B"/>
      <text x="68" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="500">In 3 days</text>
      <!-- Duration Pill -->
      <rect x="115" y="11" width="24" height="16" rx="5" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="121" y="22" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">4d</text>
      <!-- Temp Range -->
      <text x="14" y="40" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5">44°–56°F</text>
      <!-- Packed Count + Trash Icon -->
      <text x="198" y="30" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">14/18</text>
      <text x="236" y="31" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11">🗑</text>
    </g>

    <!-- SavedTripCard 2: London -->
    <g transform="translate(14, 140)">
      <rect width="260" height="52" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="23" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">London</text>
      <rect x="64" y="11" width="54" height="16" rx="5" fill="#1E293B"/>
      <text x="70" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="500">In 2 weeks</text>
      <rect x="123" y="11" width="24" height="16" rx="5" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="129" y="22" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">5d</text>
      <text x="14" y="40" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5">43°–56°F</text>
      <text x="202" y="30" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">6/21</text>
      <text x="236" y="31" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11">🗑</text>
    </g>

    <!-- SavedTripCard 3: Tokyo -->
    <g transform="translate(14, 202)">
      <rect width="260" height="52" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="23" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Tokyo</text>
      <rect x="55" y="11" width="54" height="16" rx="5" fill="#1E293B"/>
      <text x="61" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="500">In 1 month</text>
      <rect x="114" y="11" width="24" height="16" rx="5" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="120" y="22" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">7d</text>
      <text x="14" y="40" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5">50°–64°F</text>
      <text x="202" y="30" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">0/24</text>
      <text x="236" y="31" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11">🗑</text>
    </g>

    <!-- ExtendedFAB: "+ New Trip" -->
    <g transform="translate(158, 378)">
      <rect width="114" height="42" rx="14" fill="#10B981"/>
      <text x="18" y="26" fill="#052E16" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">+  New Trip</text>
    </g>

    <!-- Bottom Gesture Pill -->
    <rect x="104" y="434" width="80" height="4" rx="2" fill="#334155"/>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 2: STEP-BY-STEP INTERVIEW (6-Segment Stepper + Date Pickers + Mic)  -->
  <!-- ========================================================================= -->
  <g transform="translate(346, 20)" filter="url(#phoneShadow)">
    <!-- Phone Frame -->
    <rect width="288" height="446" rx="34" fill="#090D16" stroke="#263248" stroke-width="2.5"/>
    <!-- Status Bar -->
    <text x="26" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600">9:41</text>
    <rect x="114" y="11" width="60" height="14" rx="7" fill="#030712"/>
    <text x="236" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">5G 100%</text>

    <!-- TopAppBar: Back Arrow + "Seattle (4 days)" -->
    <text x="22" y="54" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="15">←</text>
    <text x="48" y="54" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Seattle (4 days)</text>

    <!-- 6-Segment Progress Stepper (Step 2 of 6 active) -->
    <g transform="translate(18, 70)">
      <rect x="0"   y="0" width="38" height="4" rx="2" fill="#10B981"/>
      <rect x="43"  y="0" width="38" height="4" rx="2" fill="#10B981"/>
      <rect x="86"  y="0" width="38" height="4" rx="2" fill="#1E293B"/>
      <rect x="129" y="0" width="38" height="4" rx="2" fill="#1E293B"/>
      <rect x="172" y="0" width="38" height="4" rx="2" fill="#1E293B"/>
      <rect x="215" y="0" width="37" height="4" rx="2" fill="#1E293B"/>
    </g>

    <!-- Question Heading & Subtitle -->
    <text x="18" y="100" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="700">When are you traveling?</text>
    <text x="18" y="117" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5">Select your exact Start and End dates so we can</text>
    <text x="18" y="130" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5">fetch the weather forecast for your travel dates.</text>

    <!-- Start Date & End Date Cards -->
    <g transform="translate(18, 144)">
      <rect x="0" y="0" width="121" height="52" rx="12" fill="#111827" stroke="#1E293B"/>
      <text x="12" y="19" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">START DATE</text>
      <text x="12" y="38" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">2026-11-10</text>

      <rect x="131" y="0" width="121" height="52" rx="12" fill="#111827" stroke="#1E293B"/>
      <text x="143" y="19" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">END DATE</text>
      <text x="143" y="38" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">2026-11-14</text>
    </g>

    <!-- Quick Date Preset Chips -->
    <g transform="translate(18, 208)">
      <rect x="0" y="0" width="84" height="28" rx="14" fill="#111827" stroke="#1E293B"/>
      <text x="12" y="18" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="9">Today → +3d</text>

      <rect x="90" y="0" width="96" height="28" rx="14" fill="#10B981" fill-opacity="0.16" stroke="#10B981"/>
      <text x="102" y="18" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">In 3 days (4d)</text>

      <rect x="0" y="34" width="92" height="28" rx="14" fill="#111827" stroke="#1E293B"/>
      <text x="12" y="52" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="9">In 7 days (5d)</text>

      <rect x="98" y="34" width="98" height="28" rx="14" fill="#111827" stroke="#1E293B"/>
      <text x="110" y="52" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="9">In 2 weeks (5d)</text>
    </g>

    <!-- Primary CTA Button: "Confirm 4 Days & Fetch Weather" -->
    <g transform="translate(18, 286)">
      <rect width="252" height="40" rx="12" fill="#10B981"/>
      <text x="40" y="25" fill="#052E16" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Confirm 4 Days &amp; Fetch Weather</text>
    </g>

    <!-- Bottom Voice & Text Bar -->
    <g transform="translate(14, 378)">
      <circle cx="20" cy="20" r="19" fill="#064E3B"/>
      <text x="13" y="25" fill="#A7F3D0" font-family="Inter, system-ui, sans-serif" font-size="13">🎙️</text>

      <rect x="46" y="1" width="170" height="38" rx="19" fill="#090D16" stroke="#1E293B"/>
      <text x="60" y="24" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="9.5">e.g. In 3 days for 4 days...</text>

      <circle cx="240" cy="20" r="19" fill="#1E293B"/>
      <text x="234" y="25" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="12">➤</text>
    </g>

    <!-- Bottom Gesture Pill -->
    <rect x="104" y="434" width="80" height="4" rx="2" fill="#334155"/>
  </g>

  <!-- ========================================================================= -->
  <!-- PHONE 3: TRIP CHECKLIST SCREEN (Pack | Doorway | Checkout + Items)        -->
  <!-- ========================================================================= -->
  <g transform="translate(664, 20)" filter="url(#phoneShadow)">
    <!-- Phone Frame -->
    <rect width="288" height="446" rx="34" fill="#090D16" stroke="#263248" stroke-width="2.5"/>
    <!-- Status Bar -->
    <text x="26" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600">9:41</text>
    <rect x="114" y="11" width="60" height="14" rx="7" fill="#030712"/>
    <text x="236" y="22" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">5G 100%</text>

    <!-- TopAppBar: Back + "Seattle" [4d] + "44°–56°F • 3 rainy d" + "↻ Recreate" -->
    <text x="20" y="52" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="15">←</text>
    <text x="44" y="48" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700">Seattle</text>
    <rect x="94" y="36" width="22" height="15" rx="5" fill="#1E293B"/>
    <text x="99" y="47" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">4d</text>
    <text x="44" y="61" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">44°–56°F  •  3 rainy d</text>
    <text x="214" y="51" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600">↻ Recreate</text>

    <!-- Segmented 3-Mode Pill Switcher: Pack | Doorway | Checkout -->
    <g transform="translate(14, 72)">
      <rect width="260" height="32" rx="10" fill="#111827" stroke="#1E293B"/>
      <rect x="3" y="3" width="84" height="26" rx="7" fill="#10B981"/>
      <text x="31" y="20" fill="#052E16" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700">Pack</text>
      <text x="110" y="20" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="500">Doorway</text>
      <text x="194" y="20" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="500">Checkout</text>
    </g>

    <!-- Sleek Progress Bar Strip -->
    <g transform="translate(14, 114)">
      <rect x="0" y="3" width="218" height="5" rx="2.5" fill="#1E293B"/>
      <rect x="0" y="3" width="168" height="5" rx="2.5" fill="#10B981"/>
      <text x="226" y="9" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600">14 / 18</text>
    </g>

    <!-- Category 1: ON ME -->
    <text x="16" y="138" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700">ON ME</text>
    <text x="256" y="138" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">2/2</text>

    <!-- Checked Item 1 (dimmed alpha) -->
    <g transform="translate(14, 144)" opacity="0.55">
      <rect width="260" height="44" rx="10" fill="#111827" stroke="#1E293B"/>
      <rect x="12" y="14" width="16" height="16" rx="4" fill="#10B981"/>
      <text x="16" y="26" fill="#052E16" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">✓</text>
      <text x="36" y="21" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="10.5" text-decoration="line-through">Wallet &amp; License</text>
      <text x="36" y="34" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5">Doorway  •  Personal</text>
      <rect x="226" y="13" width="24" height="18" rx="6" fill="#1E293B"/>
      <text x="232" y="25" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">×1</text>
    </g>

    <!-- Category 2: ELECTRONICS -->
    <text x="16" y="206" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700">ELECTRONICS</text>
    <text x="256" y="206" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">1/2</text>

    <!-- Unchecked Item 2: Laptop -->
    <g transform="translate(14, 212)">
      <rect width="260" height="44" rx="10" fill="#111827" stroke="#1E293B"/>
      <rect x="12" y="14" width="16" height="16" rx="4" fill="#090D16" stroke="#475569" stroke-width="1.5"/>
      <text x="36" y="21" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500">Laptop</text>
      <text x="36" y="34" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5">Doorway  •  Personal  •  Work trip</text>
      <rect x="226" y="13" width="24" height="18" rx="6" fill="#1E293B"/>
      <text x="232" y="25" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">×1</text>
    </g>

    <!-- Category 3: CLOTHES -->
    <text x="16" y="274" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700">CLOTHES</text>
    <text x="256" y="274" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="9">3/4</text>

    <!-- Unchecked Item 3: T-shirts (scaled ×5) -->
    <g transform="translate(14, 280)">
      <rect width="260" height="44" rx="10" fill="#111827" stroke="#1E293B"/>
      <rect x="12" y="14" width="16" height="16" rx="4" fill="#090D16" stroke="#475569" stroke-width="1.5"/>
      <text x="36" y="21" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500">T-shirts</text>
      <text x="36" y="34" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8.5">Carry-On  •  4 days + 1 spare</text>
      <rect x="226" y="13" width="24" height="18" rx="6" fill="#1E293B"/>
      <text x="232" y="25" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600">×5</text>
    </g>

    <!-- Gemini Weather & Trip Suggestions Section at Bottom -->
    <text x="16" y="342" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700">✨ GEMINI WEATHER &amp; TRIP SUGGESTIONS</text>
    <g transform="translate(14, 348)">
      <rect width="260" height="46" rx="10" fill="#1E293B" fill-opacity="0.55" stroke="#10B981" stroke-opacity="0.45"/>
      <text x="12" y="19" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">Rain Jacket</text>
      <rect x="74" y="8" width="76" height="14" rx="4" fill="#090D16"/>
      <text x="79" y="18" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="7.5">Clothes • Carry-On</text>
      <text x="12" y="34" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="8">3 rainy days forecast (44°–56°F)</text>
      <!-- + Add Button & Dismiss X -->
      <rect x="192" y="12" width="40" height="22" rx="6" fill="#10B981"/>
      <text x="199" y="26" fill="#052E16" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700">+ Add</text>
      <text x="241" y="27" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10">✕</text>
    </g>

    <!-- Bottom-Right Square FAB (+) -->
    <rect x="234" y="382" width="38" height="38" rx="12" fill="#10B981"/>
    <text x="247" y="407" fill="#052E16" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">+</text>

    <!-- Bottom Gesture Pill -->
    <rect x="104" y="434" width="80" height="4" rx="2" fill="#334155"/>
  </g>
</svg>
